aid: circle-medical
name: Circle Medical
description: >-
  Circle Medical is a San Francisco-based online and in-person primary care clinic
  offering telemedicine and clinic-based visits with same and next-day availability.
  Founded through Y Combinator, the company operates 20+ physical locations and provides
  virtual appointments across multiple US states through Circle Medical Care of California,
  an independent medical practice. Its 400+ board-certified physicians, physician assistants,
  and nurse practitioners treat primary care, mental health (ADHD, anxiety, depression),
  hormone and sexual health, urgent care, weight loss (GLP-1s), sleep, and dermatology.
  Circle Medical is a HIPAA-covered, patient-facing digital health provider; it publishes
  no public developer API or SDK program, and this profile captures its public web,
  legal, support, and security surface for the API Evangelist network.
